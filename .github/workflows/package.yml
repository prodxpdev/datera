name: Package

# Installers for every platform, each built on its own hardware.
#
# Native addons are why that is not optional. DuckDB and llama.cpp ship a separate
# binding per platform and architecture, and a package manager installs only the one
# matching the machine it runs on. An x64 Mac build made on an arm64 runner therefore
# ships an arm64 binding inside an x64 app — which starts, and cannot open a workspace.
# That failure mode already happened once here (the binding missing entirely), so every
# job below asserts the binding is present and built for the right architecture.
#
# Signing and notarization switch on by themselves when the secrets exist, and the build
# is unsigned-but-working until then.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DATERA_EXTENSION_DIR: ${{ github.workspace }}/vendor/duckdb-extensions

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: --mac --arm64
            unpacked: mac-arm64
            arch: arm64
            smoke: true
          - name: macOS (Intel)
            os: macos-13
            target: --mac --x64
            unpacked: mac
            arch: x86_64
            smoke: false
          - name: Windows
            os: windows-latest
            target: --win --x64
            unpacked: win-unpacked
            arch: x86-64
            smoke: false
          - name: Linux
            os: ubuntu-latest
            target: --linux --x64
            unpacked: linux-unpacked
            arch: x86-64
            smoke: false

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Compile the workspace packages before bundling the shell. The desktop main process
      # bundles @datera/cli (the MCP/HTTP server it hosts), which resolves through that
      # package's `exports` to dist/ — so without this the build fails at "Failed to
      # resolve entry for package @datera/cli". ci.yml has always done this; this workflow
      # had never actually run, so it had never needed to.
      - run: pnpm exec tsc -b

      - run: pnpm --filter @datera/desktop build
      # Staged for the *tests*, which run against the repo rather than the package. The
      # packaged app fetches its own at first run — see install-extensions.ts.
      - run: node scripts/stage-extensions.mjs

      # electron-builder wants the notarization key as a *file path*, and a secret can only
      # hold its contents. Written to the runner's temp directory, which is discarded with
      # the job — never into the workspace, where an upload step could sweep it up.
      - name: Stage the notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      # The certificate goes into a keychain we create, rather than letting
      # electron-builder manage one of its own.
      #
      # Its internal path failed here with "SecKeychainUnlock: the user name or passphrase
      # you entered is not correct" while running set-key-partition-list against its own
      # temporary keychain — a keychain it had just created, so the password it used to
      # create it and the one it used to unlock it disagreed. Rather than work around an
      # internal we cannot see, the keychain becomes ours: created, unlocked, imported into
      # and authorised in steps that are visible in this file and fail where they break.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Guarded here rather than in `if:`, because GitHub does not expose the secrets
          # context to a step condition. No certificate is not an error: the build is
          # unsigned, and says so.
          if [ -z "$MAC_CERT_P12_BASE64" ]; then
            echo "No signing certificate configured — this build will be unsigned."
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Random, and never leaves this job: it protects a keychain that is discarded
          # with the runner, so it has no reason to be a secret anyone stores.
          keychain_password=$(uuidgen)
          cert="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$cert"

          security create-keychain -p "$keychain_password" "$keychain"
          # No auto-lock: the default relocks after five minutes of inactivity, and
          # notarization can easily take longer than that.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          security import "$cert" -k "$keychain" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"

          # Without this, codesign prompts for permission to use the key — and a prompt on
          # a headless runner is a hang, not a question.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null

          security list-keychain -d user -s "$keychain" login.keychain-db
          # Names the identity without revealing it: enough to tell "imported nothing" from
          # "imported something that cannot sign".
          security find-identity -v -p codesigning "$keychain" | tail -2

      - name: Build installers
        working-directory: apps/desktop
        env:
          # No CSC_LINK or CSC_KEY_PASSWORD: the certificate is already in the keychain the
          # step above made, and electron-builder discovers it there. Absent secrets mean an
          # unsigned build, not a failed one — auto-discovery is off in that case, so it
          # does not go looking for an identity that was never installed.
          # macOS notarization via an App Store Connect API key — preferred over an
          # Apple ID password, which expires and breaks CI without warning. APPLE_API_KEY
          # itself is set by the step above, as a path.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows signing, when a certificate exists.
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Assert the native binding shipped, for the right architecture
        shell: bash
        run: |
          binding=$(find "apps/desktop/release/${{ matrix.unpacked }}" -name 'duckdb.node' | head -1)
          if [ -z "$binding" ]; then
            echo "::error::No DuckDB binding in the packaged app — it cannot open a workspace."
            exit 1
          fi
          echo "binding: $binding"
          description=$(file "$binding")
          echo "$description"
          if ! echo "$description" | grep -qi "${{ matrix.arch }}"; then
            echo "::error::The DuckDB binding is not built for ${{ matrix.arch }}."
            exit 1
          fi

      # Each job builds one architecture, and the artifact it uploads must contain only
      # that one.
      #
      # The mac target used to name both architectures in its own config, which the --arm64
      # and --x64 flags do not override — so the Apple silicon runner also produced an x64
      # app, with arm64 bindings inside it. That app starts and cannot open a workspace,
      # which is the exact failure this workflow was written to prevent, and it was being
      # uploaded beside the good build. The assertion above missed it because it inspects
      # only this job's own unpacked directory.
      - name: Assert only this architecture was built
        if: runner.os == 'macOS'
        shell: bash
        run: |
          other=$([ "${{ matrix.arch }}" = "arm64" ] && echo "x64" || echo "arm64")
          strays=$(find apps/desktop/release -maxdepth 1 -name "*mac-$other*" -print)
          if [ -n "$strays" ]; then
            echo "::error::Built $other artifacts on a ${{ matrix.arch }} runner: $strays"
            exit 1
          fi
          echo "Only ${{ matrix.arch }} artifacts present, as intended."
          ls apps/desktop/release

      # The inverse of what this used to assert. A .duckdb_extension cannot be codesigned,
      # and Apple's notary unpacks archives to find them — so one inside the bundle, in any
      # form, makes the build un-notarizable.
      - name: Assert no unsignable extension shipped
        shell: bash
        run: |
          found=$(find apps/desktop/release \( -name '*.duckdb_extension' -o -name '*.duckdb_extension.gz' \) | head -3)
          if [ -n "$found" ]; then
            echo "::error::Unsignable DuckDB extensions in the bundle — notarization will fail."
            echo "$found"
            exit 1
          fi

      # The test that proves the thing runs. Apple silicon only for now: GUI apps need a
      # display, and the hosted macOS runners are the ones that have one without setup.
      - name: Smoke-test the packaged app
        if: matrix.smoke
        env:
          DATERA_PACKAGED: '1'
        run: pnpm vitest run apps/desktop/test/packaged-smoke.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: datera-${{ matrix.unpacked }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
