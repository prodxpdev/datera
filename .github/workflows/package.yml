name: Package

# Installers for every platform, each built on its own hardware.
#
# Native addons are why that is not optional. DuckDB and llama.cpp ship a separate
# binding per platform and architecture, and a package manager installs only the one
# matching the machine it runs on. An x64 Mac build made on an arm64 runner therefore
# ships an arm64 binding inside an x64 app — which starts, and cannot open a workspace.
# That failure mode already happened once here (the binding missing entirely), so every
# job below asserts the binding is present and built for the right architecture.
#
# Signing and notarization switch on by themselves when the secrets exist, and the build
# is unsigned-but-working until then.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DATERA_EXTENSION_DIR: ${{ github.workspace }}/vendor/duckdb-extensions

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # This job holds the signing identity. It has no reason to be able to write to the
    # repository, and the release job below asks for what it needs separately.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # No Intel macOS job. `macos-13` is the only Intel image GitHub offers and it is
        # being retired — two consecutive runs sat queued without ever being allocated.
        # The alternative, cross-building x64 on an arm64 runner, reintroduces exactly the
        # mismatched-native-binding failure this file exists to prevent, and nothing on
        # that runner could smoke-test the result. Apple stopped selling Intel Macs in
        # 2023; an Intel user builds from source until that changes.
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: --mac --arm64
            unpacked: mac-arm64
            arch: arm64
            smoke: true
          - name: Windows
            os: windows-latest
            target: --win --x64
            unpacked: win-unpacked
            arch: x86-64
            smoke: false
          - name: Linux
            os: ubuntu-latest
            target: --linux --x64
            unpacked: linux-unpacked
            arch: x86-64
            smoke: false

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Compile the workspace packages before bundling the shell. The desktop main process
      # bundles @datera/cli (the MCP/HTTP server it hosts), which resolves through that
      # package's `exports` to dist/ — so without this the build fails at "Failed to
      # resolve entry for package @datera/cli". ci.yml has always done this; this workflow
      # had never actually run, so it had never needed to.
      - run: pnpm exec tsc -b

      - run: pnpm --filter @datera/desktop build
      # Staged for the *tests*, which run against the repo rather than the package. The
      # packaged app fetches its own at first run — see install-extensions.ts.
      - run: node scripts/stage-extensions.mjs

      # electron-builder wants the notarization key as a *file path*, and a secret can only
      # hold its contents. Written to the runner's temp directory, which is discarded with
      # the job — never into the workspace, where an upload step could sweep it up.
      - name: Stage the notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      # The certificate goes into a keychain we create, rather than letting
      # electron-builder manage one of its own.
      #
      # Its internal path failed here with "SecKeychainUnlock: the user name or passphrase
      # you entered is not correct" while running set-key-partition-list against its own
      # temporary keychain — a keychain it had just created, so the password it used to
      # create it and the one it used to unlock it disagreed. Rather than work around an
      # internal we cannot see, the keychain becomes ours: created, unlocked, imported into
      # and authorised in steps that are visible in this file and fail where they break.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Guarded here rather than in `if:`, because GitHub does not expose the secrets
          # context to a step condition. No certificate is not an error: the build is
          # unsigned, and says so.
          if [ -z "$MAC_CERT_P12_BASE64" ]; then
            echo "No signing certificate configured — this build will be unsigned."
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Random, and never leaves this job: it protects a keychain that is discarded
          # with the runner, so it has no reason to be a secret anyone stores.
          keychain_password=$(uuidgen)
          cert="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$cert"

          security create-keychain -p "$keychain_password" "$keychain"
          # No auto-lock: the default relocks after five minutes of inactivity, and
          # notarization can easily take longer than that.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          security import "$cert" -k "$keychain" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"

          # Without this, codesign prompts for permission to use the key — and a prompt on
          # a headless runner is a hang, not a question.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null

          security list-keychain -d user -s "$keychain" login.keychain-db

          # The disk image is signed later, by hash rather than by name — a name with
          # parentheses and spaces in it is a quoting accident waiting to happen.
          identity=$(security find-identity -v -p codesigning "$keychain" | awk 'NR==1{print $2}')
          echo "DATERA_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          # Names the identity without revealing it: enough to tell "imported nothing" from
          # "imported something that cannot sign".
          security find-identity -v -p codesigning "$keychain" | tail -2

      - name: Build installers
        working-directory: apps/desktop
        env:
          # No CSC_LINK or CSC_KEY_PASSWORD: the certificate is already in the keychain the
          # step above made, and electron-builder discovers it there. Absent secrets mean an
          # unsigned build, not a failed one — auto-discovery is off in that case, so it
          # does not go looking for an identity that was never installed.
          # macOS notarization via an App Store Connect API key — preferred over an
          # Apple ID password, which expires and breaks CI without warning. APPLE_API_KEY
          # itself is set by the step above, as a path.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows signing, when a certificate exists.
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: npx electron-builder ${{ matrix.target }} --publish never

      # electron-builder notarizes the .app and then builds the disk image around it, so the
      # dmg itself carries no ticket. Gatekeeper assesses what the user downloads — the dmg —
      # and rejected it with "no usable signature", which is the first thing a Mac user would
      # have met. The app being notarized is necessary and not sufficient.
      - name: Notarize and staple the disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY:-}" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "No notarization credentials — the disk image stays unnotarized."
            exit 0
          fi

          shopt -s nullglob
          images=(apps/desktop/release/*.dmg)
          if [ ${#images[@]} -eq 0 ]; then
            echo "No disk image to notarize."
            exit 0
          fi

          for dmg in "${images[@]}"; do
            # Sign first, then notarize, then staple — Apple's order, and all three are
            # required. A notarized, stapled but *unsigned* disk image still fails
            # Gatekeeper's assessment with "no usable signature", which is what the first
            # attempt at this shipped: notarization succeeded and the check still refused it.
            if [ -n "${DATERA_SIGNING_IDENTITY:-}" ]; then
              echo "Signing $dmg"
              codesign --force --timestamp --sign "$DATERA_SIGNING_IDENTITY" "$dmg"
            fi

            echo "Notarizing $dmg"
            # Fast, because the contents are already notarized: Apple recognises the app
            # inside and this is a second ticket for the container.
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
          done

          # Asserted, not assumed. This is the exact check Gatekeeper performs on a file the
          # user has just downloaded, and it is the one that was failing.
          for dmg in "${images[@]}"; do
            xcrun stapler validate "$dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"
          done

      # Put the signing material beyond reach the moment it is no longer needed.
      #
      # The keychain was left unlocked and as the user default, and $APPLE_API_KEY pointed
      # at the notarization key on disk, for every step that followed — including
      # electron-builder running the whole transitive dependency tree and a smoke test that
      # launches the packaged application. Any code in there could sign binaries with the
      # Developer ID or read the key. Nothing after this point needs either.
      - name: Put the signing material away
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=" >> "$GITHUB_ENV"
          security list-keychain -d user -s login.keychain-db || true
          security lock-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Assert the native binding shipped, for the right architecture
        shell: bash
        run: |
          binding=$(find "apps/desktop/release/${{ matrix.unpacked }}" -name 'duckdb.node' | head -1)
          if [ -z "$binding" ]; then
            echo "::error::No DuckDB binding in the packaged app — it cannot open a workspace."
            exit 1
          fi
          echo "binding: $binding"
          description=$(file "$binding")
          echo "$description"
          if ! echo "$description" | grep -qi "${{ matrix.arch }}"; then
            echo "::error::The DuckDB binding is not built for ${{ matrix.arch }}."
            exit 1
          fi

      # Each job builds one architecture, and the artifact it uploads must contain only
      # that one.
      #
      # The mac target used to name both architectures in its own config, which the --arm64
      # and --x64 flags do not override — so the Apple silicon runner also produced an x64
      # app, with arm64 bindings inside it. That app starts and cannot open a workspace,
      # which is the exact failure this workflow was written to prevent, and it was being
      # uploaded beside the good build. The assertion above missed it because it inspects
      # only this job's own unpacked directory.
      - name: Assert only this architecture was built
        if: runner.os == 'macOS'
        shell: bash
        run: |
          other=$([ "${{ matrix.arch }}" = "arm64" ] && echo "x64" || echo "arm64")
          strays=$(find apps/desktop/release -maxdepth 1 -name "*mac-$other*" -print)
          if [ -n "$strays" ]; then
            echo "::error::Built $other artifacts on a ${{ matrix.arch }} runner: $strays"
            exit 1
          fi
          echo "Only ${{ matrix.arch }} artifacts present, as intended."
          ls apps/desktop/release

      # The inverse of what this used to assert. A .duckdb_extension cannot be codesigned,
      # and Apple's notary unpacks archives to find them — so one inside the bundle, in any
      # form, makes the build un-notarizable.
      - name: Assert no unsignable extension shipped
        shell: bash
        run: |
          found=$(find apps/desktop/release \( -name '*.duckdb_extension' -o -name '*.duckdb_extension.gz' \) | head -3)
          if [ -n "$found" ]; then
            echo "::error::Unsignable DuckDB extensions in the bundle — notarization will fail."
            echo "$found"
            exit 1
          fi

      # The test that proves the thing runs. Apple silicon only for now: GUI apps need a
      # display, and the hosted macOS runners are the ones that have one without setup.
      - name: Smoke-test the packaged app
        if: matrix.smoke
        env:
          DATERA_PACKAGED: '1'
        run: pnpm vitest run apps/desktop/test/packaged-smoke.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: datera-${{ matrix.unpacked }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14

  # Publish the installers where the public can actually reach them.
  #
  # The matrix above uploads Actions artifacts, which need a GitHub login to download and
  # expire after fourteen days — fine for checking a build, useless as a download link. The
  # marketing site points at a release, so there has to be one.
  release:
    name: publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # The only job here that writes anything to the repository.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Installers only. The unpacked directories and blockmaps are build intermediates,
          # and a release page listing them invites someone to download the wrong thing.
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release

          if [ -z "$(ls -A release)" ]; then
            echo "::error::No installers to publish — the packaging jobs produced nothing."
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"

          # Written here rather than hand-maintained, because the honest caveats are the
          # ones a person skips when they are in a hurry to ship.
          cat > notes.md <<'NOTES'
          ## Install

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon) | `.dmg` — signed and notarized by Apple |
          | Windows | `.exe` — **not yet signed**, see below |
          | Linux | `.AppImage`, or `.deb` for Debian/Ubuntu |

          **Windows will warn you.** The build is not code-signed yet, so SmartScreen shows
          "Windows protected your PC". Choose **More info → Run anyway**. Signing is being
          arranged; until then this warning is expected and is not a sign of anything wrong.

          **Intel Macs:** no installer. GitHub retired the last Intel macOS runner, and
          cross-building on Apple Silicon would ship an app with the wrong native bindings —
          it would launch and then fail to open a workspace. Build from source instead.

          **First run needs the network once** to fetch the local model and the DuckDB
          extensions. After that Datera works offline; nothing about your data is uploaded.
          NOTES

          gh release create "$version" release/* \
            --title "Datera $version" \
            --notes-file notes.md \
            --verify-tag
