<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      .wm  { font-family:'Inter',system-ui,sans-serif; font-weight:650; letter-spacing:-1.5px; }
      .cap { font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:500; letter-spacing:.06em; text-transform:uppercase; }
      .tag { font-family:'JetBrains Mono',ui-monospace,monospace; letter-spacing:.02em; }
    </style>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- gradient mark: data bars receding into transparency inside a glass pane -->
    <g id="mark">
      <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#g)"/>
      <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#gloss)"/>
      <rect x="24" y="30" width="52" height="11" rx="5.5" fill="#fff" opacity=".95"/>
      <rect x="24" y="47" width="40" height="11" rx="5.5" fill="#fff" opacity=".66"/>
      <rect x="24" y="64" width="28" height="11" rx="5.5" fill="#fff" opacity=".42"/>
    </g>
    <!-- monochrome mark -->
    <g id="markMono">
      <rect x="2" y="2" width="96" height="96" rx="26" fill="#12161c"/>
      <rect x="24" y="30" width="52" height="11" rx="5.5" fill="#fff" opacity=".95"/>
      <rect x="24" y="47" width="40" height="11" rx="5.5" fill="#fff" opacity=".6"/>
      <rect x="24" y="64" width="28" height="11" rx="5.5" fill="#fff" opacity=".38"/>
    </g>
  </defs>

  <rect width="920" height="600" fill="#fbfcfd"/>

  <!-- ================= HERO LOCKUP ================= -->
  <use href="#mark" transform="translate(64 46) scale(1.18)"/>
  <text class="wm" x="214" y="150" font-size="70" fill="#12161c">Datera</text>
  <text class="tag" x="217" y="182" font-size="15" fill="#7b828f">Query any data. See everything.</text>

  <line x1="64" y1="248" x2="856" y2="248" stroke="#e6e8ee" stroke-width="1"/>

  <!-- ================= VARIATIONS ================= -->
  <!-- 1 · icon -->
  <rect x="64" y="286" width="176" height="176" rx="18" fill="#fff" stroke="#e6e8ee"/>
  <use href="#mark" transform="translate(112 334) scale(0.8)"/>
  <text class="cap" x="152" y="486" font-size="10.5" fill="#7b828f" text-anchor="middle">Icon / app</text>

  <!-- 2 · on dark -->
  <rect x="264" y="286" width="256" height="176" rx="18" fill="#111624"/>
  <use href="#mark" transform="translate(292 344) scale(0.62)"/>
  <text class="wm" x="360" y="392" font-size="34" fill="#ffffff">Datera</text>
  <text class="cap" x="392" y="486" font-size="10.5" fill="#7b828f" text-anchor="middle">On dark</text>

  <!-- 3 · monochrome -->
  <rect x="544" y="286" width="176" height="176" rx="18" fill="#fff" stroke="#e6e8ee"/>
  <use href="#markMono" transform="translate(592 334) scale(0.8)"/>
  <text class="cap" x="632" y="486" font-size="10.5" fill="#7b828f" text-anchor="middle">Monochrome</text>

  <!-- 4 · favicon sizes -->
  <rect x="744" y="286" width="112" height="176" rx="18" fill="#fff" stroke="#e6e8ee"/>
  <use href="#mark" transform="translate(768 330) scale(0.32)"/>
  <use href="#mark" transform="translate(772 388) scale(0.16)"/>
  <text class="cap" x="800" y="486" font-size="10.5" fill="#7b828f" text-anchor="middle">32 · 16 px</text>

  <!-- ================= PALETTE ================= -->
  <g transform="translate(64 520)">
    <rect x="0"   y="0" width="40" height="40" rx="9" fill="#4f46e5"/>
    <text class="cap" x="52" y="17" font-size="10" fill="#12161c">Indigo</text>
    <text class="tag" x="52" y="34" font-size="11" fill="#7b828f">#4F46E5</text>

    <rect x="190" y="0" width="40" height="40" rx="9" fill="#8b5cf6"/>
    <text class="cap" x="242" y="17" font-size="10" fill="#12161c">Violet</text>
    <text class="tag" x="242" y="34" font-size="11" fill="#7b828f">#8B5CF6</text>

    <rect x="380" y="0" width="40" height="40" rx="9" fill="#12161c"/>
    <text class="cap" x="432" y="17" font-size="10" fill="#12161c">Ink</text>
    <text class="tag" x="432" y="34" font-size="11" fill="#7b828f">#12161C</text>

    <rect x="540" y="0" width="40" height="40" rx="9" fill="#fbfcfd" stroke="#e6e8ee"/>
    <text class="cap" x="592" y="17" font-size="10" fill="#12161c">Paper</text>
    <text class="tag" x="592" y="34" font-size="11" fill="#7b828f">#FBFCFD</text>
  </g>
</svg>
